name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Create Version Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npx changeset tag
          commit: "chore: version flowershow skills"
          title: "chore: version flowershow skills"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attach to the new release:
      # - flowershow.zip (the skill folder), for uploading the skill in claude.ai /
      #   Claude Desktop / ChatGPT:
      #   https://github.com/flowershow/skills/releases/latest/download/flowershow.zip
      # - flowershow-openai-plugin.zip (Codex-format plugin package), for uploading at
      #   platform.openai.com/plugins:
      #   https://github.com/flowershow/skills/releases/latest/download/flowershow-openai-plugin.zip
      - name: Attach skill bundle and OpenAI plugin package to release
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          (cd skills && zip -r ../flowershow.zip flowershow)
          zip -r -X flowershow-openai-plugin.zip .codex-plugin .mcp.json skills assets
          gh release upload "v${VERSION}" flowershow.zip flowershow-openai-plugin.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
