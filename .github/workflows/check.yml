name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  sync:
    name: Skill copy and manifests in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-skill-version.mjs --check
      - name: Skill installs with the skills CLI
        run: npx -y skills add . --list
        env:
          DISABLE_TELEMETRY: '1'
